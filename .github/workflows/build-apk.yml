name: Build NEXUS Android 9 Settings APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "NEXUS_ANDROID_9_SETTINGS_GITHUB_V5.zip"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.2"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-35
            build-tools;35.0.0
      - name: Unpack Android Studio project
        run: |
          test -f NEXUS_ANDROID_9_SETTINGS_GITHUB_V5.zip
          unzip -q NEXUS_ANDROID_9_SETTINGS_GITHUB_V5.zip
          cd NEXUS_ANDROID_9_SETTINGS
          gradle --no-daemon clean assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: NEXUS-ANDROID-9-SETTINGS-V5-debug
          path: NEXUS_ANDROID_9_SETTINGS/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
